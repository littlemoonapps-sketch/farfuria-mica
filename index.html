<style>
/* Layout: one-column phone app; sticky header with age picker, photo grid of recipes, day planner, bottom tab bar, bottom sheets */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --sunk:#E6ECE5; --line:#D5DDD3;
  --ink:#1E2924; --muted:#5D6B64; --accent:#2F6E5D; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5;
  --yolk:#B97A16; --leaf:#3D8A5E; --plum:#80508A; --coral:#C25A44;
  --danger-bg:#FBEDE8; --danger:#A8432F; --scrim:rgba(10,20,16,.45);
  --f-display:"Fredoka","Baloo 2",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1B2320; --sunk:#232D29; --line:#2F3B36;
  --ink:#E6EDE9; --muted:#9AA9A2; --accent:#7CC4AE; --accent-ink:#0F1A16; --accent-soft:#1F3A32;
  --yolk:#F0B65C; --leaf:#7CC49A; --plum:#C69AC8; --coral:#EE9480;
  --danger-bg:#3A221C; --danger:#F2A592; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1B2320; --sunk:#232D29; --line:#2F3B36;
  --ink:#E6EDE9; --muted:#9AA9A2; --accent:#7CC4AE; --accent-ink:#0F1A16; --accent-soft:#1F3A32;
  --yolk:#F0B65C; --leaf:#7CC49A; --plum:#C69AC8; --coral:#EE9480;
  --danger-bg:#3A221C; --danger:#F2A592; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:600;font-size:1.55rem;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.lbl{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:500;font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:1.05rem;margin:0;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.view{display:flex;flex-direction:column;gap:14px;padding-block:14px 20px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:600;font-size:.88rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.age .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font:inherit;color:var(--ink)}

/* recipe grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.rcard{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0}
.ph{aspect-ratio:4/3;width:100%;max-width:100%;background:var(--sunk);display:block;object-fit:cover}
.rcard .body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rcard .meta{display:flex;justify-content:space-between;gap:6px;font-size:.78rem;font-weight:700}
.rcard .meta .t{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.rcard h3{font-size:.98rem}
.pin{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px}
.tx-md{color:var(--yolk)} .tx-pr{color:var(--leaf)} .tx-ci{color:var(--plum)} .tx-gu{color:var(--coral)}
.count{font-size:.9rem}

.filters{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.frow{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;min-width:0}
.frow .chip{padding:5px 11px;font-size:.84rem}
.filters .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* planner */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{border:none;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:.88rem}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px 10px 14px;background:var(--sunk)}
.day-h .d{display:flex;flex-direction:column}
.day-h small{color:var(--muted);font-weight:600}
.today{color:var(--accent)}
.prow{display:grid;grid-template-columns:56px 1fr 36px;gap:10px;align-items:center;padding:8px 8px 8px 12px;border-top:1px solid var(--line)}
.prow img{width:56px;height:42px;border-radius:8px;object-fit:cover;background:var(--sunk)}
.prow .nm{background:none;border:none;text-align:left;padding:0;min-width:0;display:flex;flex-direction:column}
.prow .nm b{font-weight:600;line-height:1.3}
.prow .nm span{font-size:.78rem;font-weight:700}
.x{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.1rem;line-height:1;color:var(--muted)}
.day .none{padding:12px 14px;color:var(--muted);font-size:.92rem;border-top:1px solid var(--line)}

/* shopping */
.group{display:flex;flex-direction:column;gap:6px}
.group h3{font-size:.78rem;font-family:var(--f-body);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 2px 0}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer}
.item input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.item .nm{flex:1;min-width:0}
.item .qt{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;white-space:nowrap}
.item.done .nm,.item.done .qt{text-decoration:line-through;opacity:.5}
.progress{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.for{font-size:.9rem;color:var(--muted)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:12px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:60;white-space:nowrap}

/* tips */
.tip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.tip ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tip.warn{background:var(--danger-bg);border-color:transparent}
.tip.warn h3{color:var(--danger)}
.tip.hi{background:var(--accent-soft);border-color:transparent}
.plate{display:flex;gap:10px;flex-wrap:wrap}
.plate div{flex:1 1 120px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.plate b{display:block;font-family:var(--f-display);font-weight:500}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;color:var(--muted);text-decoration:none;font-size:.75rem;font-weight:700}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--coral);color:#fff;font-size:.68rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94%;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;animation:up .25s ease-out}
.sheet .pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.progress i{transition:none}}
.hero{position:relative}
.hero img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--sunk)}
.hero .close{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px))}
.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);flex:none;font-size:1.3rem;line-height:1}
.sheet-title{padding-top:16px;display:flex;flex-direction:column;gap:6px}
.facts{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem}
.facts span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:600}
.planbox{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips .chip{font-size:.84rem;padding:6px 11px}
.daychips .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;font-weight:700}
.stepper output{min-width:80px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.ing{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.ing li:first-child{border-top:none}
.ing .q{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.little{background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:.95rem}
.little b{font-family:var(--f-display);font-weight:500}

/* picker */
.pick-head{position:sticky;top:0;z-index:2;background:var(--bg);padding-block:16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding-top:6px}
.pcard{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column}
.pcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pcard .body{padding:7px 9px 9px;font-weight:600;font-size:.9rem;line-height:1.25}
.pcard .tick{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:transparent;font-size:.85rem}
.pcard[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick-foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px}
.pick-foot .btn{flex:1}
</style>
</head>
<body>


<header><div class="wrap">
  <div class="brand"><h1>Farfuria <span>Mică</span></h1><span class="lbl">Vârsta copilului</span></div>
  <div class="chips age" id="age" role="group" aria-label="Vârsta copilului"></div>
</div></header>

<main class="wrap">
  <section class="view" id="v-retete"></section>
  <section class="view" id="v-plan" hidden></section>
  <section class="view" id="v-cumparaturi" hidden></section>
  <section class="view" id="v-sfaturi" hidden></section>
</main>

<nav class="tabs" aria-label="Secțiuni"><div class="in">
  <a href="#retete" data-v="retete"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg>Rețete</a>
  <a href="#plan" data-v="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Planul meu</a>
  <a href="#cumparaturi" data-v="cumparaturi"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>Cumpărături<span class="badge" id="badge" hidden></span></a>
  <a href="#sfaturi" data-v="sfaturi"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>Sfaturi</a>
</div></nav>

<script>
const R=[{"id":"piure-morcov","c":"pr","a":6,"b":9,"n":"Piure de morcov","t":25,"s":4,"i":[["morcovi",3,"buc","L"],["apă",300,"ml","K"],["ulei de măsline",1,"linguriță","K"]],"p":["Curăță morcovii și taie-i rondele.","Fierbe-i la abur sau în puțină apă 15–20 de minute, până sunt foarte moi.","Pasează-i cu blenderul, adăugând din apa de fiert până obții un piure fin.","Amestecă uleiul și servește călduț."],"m":"La început piureul trebuie să fie foarte fin și destul de lichid. Pe măsură ce crește, îl poți face mai gros și cu mici bucățele."},{"id":"piure-dovleac-cartof","c":"pr","a":6,"b":9,"n":"Piure de dovleac și cartof","t":30,"s":4,"i":[["dovleac",250,"g","L"],["cartof",1,"buc","L"],["ulei de măsline",1,"linguriță","K"]],"p":["Taie dovleacul și cartoful cuburi.","Fierbe-le la abur 20 de minute, până se strivesc ușor.","Pasează-le fin cu puțină apă de fiert și adaugă uleiul."],"m":"Dovleacul are gust dulce și e de obicei acceptat ușor. Se congelează bine în tăvițe de gheață, câte o porție pe cub."},{"id":"piure-dovlecel-mazare","c":"ci","a":6,"b":9,"n":"Piure de dovlecel cu mazăre","t":20,"s":4,"i":[["dovlecel",1,"buc","L"],["mazăre congelată",100,"g","L"],["cartof",1,"buc","L"],["ulei de măsline",1,"linguriță","K"]],"p":["Curăță dovlecelul și cartoful și taie-le cuburi.","Fierbe-le cu mazărea 12–15 minute.","Pasează totul fin și strecoară dacă rămân cojițe de mazăre.","Adaugă uleiul."],"m":"Cojițele de mazăre pot rămâne în piure. Strecoară-l prin sită pentru primele încercări."},{"id":"piure-mar-para","c":"gu","a":6,"b":10,"n":"Piure de măr și pară","t":15,"s":3,"i":[["măr",1,"buc","L"],["pară coaptă",1,"buc","L"],["apă",50,"ml","K"]],"p":["Curăță fructele de coajă și cotor și taie-le cuburi.","Fierbe-le cu apa 8–10 minute, acoperit.","Pasează fin."],"m":"Fără zahăr adăugat. Pentru copiii mai mari, merge și strivit cu furculița, cu bucăți moi."},{"id":"piure-banana-avocado","c":"md","a":6,"b":10,"n":"Piure de banană și avocado","t":5,"s":1,"i":[["banană coaptă",0.5,"buc","L"],["avocado copt",0.25,"buc","L"]],"p":["Pisează banana și avocado cu furculița până sunt fine.","Dacă e prea gros, adaugă puțin lapte matern sau praf."],"m":"Se face pe loc și nu necesită gătit. Se oxidează repede, deci servește-l imediat."},{"id":"terci-orez","c":"md","a":6,"b":9,"n":"Terci de orez","t":10,"s":1,"i":[["fulgi sau făină de orez pentru copii",2,"lingură","P"],["lapte matern sau praf",120,"ml","D"]],"p":["Încălzește laptele până e călduț (nu fierbinte dacă e lapte matern).","Presară fulgii de orez, amestecând.","Lasă 2 minute să se îngroașe și verifică temperatura."],"m":"Primul terci poate fi destul de lichid. Pe măsură ce se obișnuiește, îl faci mai gros."},{"id":"piure-pui-legume","c":"pr","a":7,"b":10,"n":"Piure de pui cu legume","t":30,"s":4,"i":[["piept de pui",100,"g","C"],["morcov",1,"buc","L"],["cartof",1,"buc","L"],["păstârnac",0.5,"buc","L"],["ulei de măsline",1,"linguriță","K"]],"p":["Taie puiul și legumele cuburi mici.","Fierbe totul în apă cât să le acopere, 20–25 de minute.","Pasează fin cu zeama de la fiert, până ajunge la consistența dorită.","Adaugă uleiul."],"m":"Carnea pasată se poate simți uscată. Folosește zeama de fiert ca să-l faci mai cremos."},{"id":"piure-broccoli-cartof-dulce","c":"ci","a":7,"b":10,"n":"Piure de broccoli și cartof dulce","t":25,"s":4,"i":[["cartof dulce",1,"buc","L"],["broccoli",100,"g","L"],["ulei de măsline",1,"linguriță","K"]],"p":["Taie cartoful dulce cuburi și broccoliul în buchețele.","Fierbe cartoful la abur 15 minute, apoi adaugă broccoliul pentru încă 6–7 minute.","Pasează cu puțină apă și ulei."],"m":"Cartoful dulce îndulcește gustul de broccoli, care singur poate fi refuzat la început."},{"id":"piure-prune","c":"gu","a":6,"b":11,"n":"Piure de prune uscate","t":15,"s":6,"i":[["prune uscate fără sâmburi",8,"buc","K"],["apă",150,"ml","K"]],"p":["Pune prunele în apă fierbinte și lasă-le 10 minute la înmuiat.","Pasează-le fin cu o parte din apă.","Păstrează la frigider până la 3 zile."],"m" ,"i":[["pâine",1,"felii","P"],["avocado copt",0.25,"buc","L"]],"p":["Prăjește ușor pâinea.","Pisează avocado și întinde-l pe pâine.","Taie pâinea în fâșii."],"m":"Pâinea ușor prăjită e mai ușor de ținut și nu se lipește de cerul gurii."},{"id":"bastonase-cartof-dulce","c":"gu","a":9,"b":36,"n":"Bastonașe de cartof dulce la cuptor","t":35,"s":3,"i":[["cartof dulce",1,"buc","L"],["ulei de măsline",1,"lingură","K"],["boia dulce",1,"vârf","K"]],"p":["Încălzește cuptorul la 200°C.","Taie cartoful în bastonașe groase cât degetul.","Amestecă-le cu ulei și boia și întinde-le în tavă.","Coace 25 de minute, întorcându-le o dată, până sunt moi în interior."],"m":"Trebuie să fie moi, nu crocante. Testează strivind unul între degete."},{"id":"paste-dovlecel-branza","c":"pr","a":9,"b":24,"n":"Paste cu dovlecel și brânză","t":20,"s":3,"i":[["paste mici",100,"g","P"],["dovlecel",1,"buc","L"],["brânză de vaci",60,"g","D"],["ulei de măsline",1,"linguriță","K"]],"p":["Fierbe pastele până sunt bine moi.","Rade dovlecelul și călește-l în ulei 4 minute.","Amestecă pastele cu dovlecelul și brânza."],"m":"Pentru bebeluși sub 1 an, alege paste mici sau taie-le mărunt."},{"id":"chiftele-somon","c":"ci","a":9,"b":36,"n":"Chifteluțe de somon și cartof","t":35,"s":4,"i":[["file de somon",200,"g","C"],["cartofi",250,"g","L"],["ouă",1,"buc","D"],["mărar",1,"lingură","L"],["ulei de măsline",1,"lingură","K"]],"p":["Fierbe cartofii și pisează-i.","Coace sau fierbe somonul 12 minute, apoi desfă-l în fulgi și verifică oasele.","Amestecă somonul cu cartofii, oul și mărarul.","Formează chifteluțe și coace-le la 200°C 15 minute."],"m":"Somonul aduce acizi omega-3. Verifică foarte atent să nu rămână oase."},{"id":"orez-pui-morcov","c":"pr","a":9,"b":18,"n":"Orez moale cu pui și morcov","t":30,"s":3,"i":[["orez",80,"g","P"],["piept de pui",150,"g","C"],["morcov",1,"buc","L"],["apă",500,"ml","K"],["unt",5,"g","D"]],"p":["Fierbe puiul tăiat cuburi mici cu morcovul ras 10 minute.","Adaugă orezul și fierbe înc "p":["Pune peștele în tavă, stropește-l cu ulei și lămâie și presară mărar.","Coace la 190°C 15–18 minute, până se desface ușor în fulgi.","Fierbe orezul și broccoliul (8–10 minute) până sunt moi.","Desface peștele în fulgi și verifică atent să nu aibă oase."],"m":"Verifică peștele cu degetele, nu doar cu ochii. Oasele mici sunt greu de văzut."},{"id":"paste","c":"pr","a":10,"b":36,"n":"Paste cu sos de roșii și carne","t":30,"s":4,"i":[["paste mici",200,"g","P"],["carne tocată de vită",300,"g","C"],["passata de roșii",400,"ml","K"],["morcov",1,"buc","L"],["ceapă",0.5,"buc","L"],["ulei de măsline",1,"lingură","K"],["busuioc uscat",1,"vârf","K"]],"p":["Călește ceapa și morcovul rase în ulei 3 minute.","Adaugă carnea și sfărâm-o cu lingura până nu mai e roz.","Toarnă passata și busuiocul, fierbe la foc mic 15 minute.","Fierbe pastele puțin peste timpul de pe pachet, ca să fie moi, și amestecă-le cu sosul."],"m":"Pastele mici (steluțe, orzo, scoici mici) sunt cele mai ușoare. Nu adăuga sare în apa pastelor pentru porția celui mic."},{"id":"pui","c":"pr","a":10,"b":36,"n":"Pui cu piure și mazăre","t":35,"s":4,"i":[["piept de pui",350,"g","C"],["cartofi",500,"g","L"],["mazăre congelată",150,"g","L"],["lapte",100,"ml","D"],["unt",15,"g","D"]],"p":["Fierbe puiul în apă cu un morcov și o ceapă, 20–25 de minute.","Fierbe separat cartofii, apoi pisează-i cu laptele cald și untul.","Fierbe mazărea 5 minute și strivește-o ușor.","Mărunțește puiul fin sau rupe-l în fâșii subțiri."],"m":"Zeama de la pui o poți folosi ca bază de supă a doua zi. Carnea uscată se mestecă greu: amestec-o cu puțin piure."},{"id":"risotto","c":"pr","a":10,"b":36,"n":"Risotto cu legume","t":30,"s":4,"i":[["orez",150,"g","P"],["dovlecel",1,"buc","L"],["morcov",1,"buc","L"],["mazăre congelată",100,"g","L"],["parmezan ras",30,"g","D"],["apă sau supă de legume fără sare",700,"ml","K"],["unt",15,"g","D"]],"p":["Călește în unt morcovul ras 2 minute, apoi adaugă orezul.","Toarnă lichidul cald treptat, câte un polonic, amestecând.","După 10 minute adaugă dovlecelul ras și mazărea.","Când orezul e cremos și moale (cam 20 de minute), amestecă parmezanul."],"m":"Parmezanul e destul de sărat, deci nu mai e nevoie de sare deloc."},{"id":"chiftelute","c":"ci","a":10,"b":36,"n":"Chifteluțe la cuptor din curcan și dovlecel","t":40,"s":4,"i":[["carne tocată de curcan",400,"g","C"],["dovlecel",1,"buc","L"],["morcov",1,"buc","L"],["ouă",1,"buc","D"],["fulgi fini de ovăz",3,"lingură","P"],["usturoi",1,"cățel","L"],["mărar",1,"lingură","L"],["cașcaval ras",2,"lingură","D"],["ulei de măsline",1,"lingură","K"]],"p":["Încălzește cuptorul la 200°C și unge o tavă cu hârtie de copt.","Rade dovlecelul și morcovul, apoi stoarce bine dovlecelul într-un prosop.","Amestecă toate ingredientele și lasă compoziția 10 minute.","Formează chifteluțe cât o nucă (cam 20) și coace-le 18–20 de minute."],"m":"Taie-le în bucăți și verifică să nu fie fierbinți la mijloc. Se congelează până la 3 luni."},{"id":"budinca","c":"ci","a":10,"b":36,"n":"Budincă de paste cu brânză","t":40,"s":4,"i":[["paste mici",150,"g","P"],["brânză de vaci",250,"g","D"],["ouă",2,"buc","D"],["lapte",100,"ml","D"],["unt",10,"g","D"]],"p":["Fierbe pastele până sunt moi și scurge-le.","Amestecă brânza cu ouăle și laptele, apoi adaugă pastele.","Toarnă în tavă unsă cu unt și coace la 180°C 25 de minute.","Lasă să se răcească 10 minute înainte de tăiere."],"m":"Se taie ușor în cuburi pe care cel mic le ia singur. Merge și rece, la gustare."},{"id":"supa-pui-taitei","c":"pr","a":10,"b":36,"n":"Supă de pui cu tăiței","t":45,"s":5,"i":[["pulpe de pui",300,"g","C"],["morcov",2,"buc","L"],["păstârnac",1,"buc","L"],["țelină rădăcină",50,"g","L"],["ceapă",0.5,"buc","L"],["tăiței fini",60,"g","P"],["apă",1500,"ml","K"],["pătrunjel",1,"lingură","L"]],"p":["Fierbe puiul cu ceapa în apă rece, la foc mic, luând spuma.","După 20 de minute adaugă legumele tăiate mărunt și fierbe încă 20 de minute.","Scoate puiul, dezosează-l și mărunțește-l.","Fierbe tăițeii în supă 5 minute, pune carnea înapoi și presară pătrunjel."],"m":"Rupe tăițeii în bucăți scurte, ca să nu fie greu de mâncat cu lingura."},{"id":"ciorba-perisoare","c":"pr","a":12,"b":36,"n":"Ciorbiță de perișoare","t":50,"s":5,"i":[["carne tocată de vită și porc",250,"g","C"],["orez",2,"lingură","P"],["ouă",1,"buc","D"],["morcov",1,"buc","L"],["ardei gras",0.5,"buc","L"],["ceapă",0.5,"buc","L"],["passata de roșii",150,"ml","K"],["leuștean",1,"lingură","L"],["apă",1500,"ml","K"]],"p":["Fierbe legumele tăiate mărunt 15 minute.","Amestecă carnea cu orezul și oul și formează perișoare mici, cât o alună.","Pune perișoarele în supa care fierbe și fierbe încă 25 de minute.","Adaugă passata și leușteanul. Pentru cel mic, acrește foarte puțin sau deloc."],"m":"Borșul și sarea fac ciorba prea acră și sărată pentru cei mici. Pune porția lui deoparte înainte să acrești."},{"id":"omleta","c":"md","a":12,"b":36,"n":"Omletă moale cu brânză și roșie","t":10,"s":2,"i":[["ouă",3,"buc","D"],["cașcaval ras",30,"g","D"],["roșie",1,"buc","L"],["unt",10,"g","D"],["pâine",2,"felii","P"]],"p":["Opărește roșia, decojește-o și taie-o cubulețe mici, fără semințe.","Bate ouăle cu brânza.","Topește untul în tigaie la foc mic, toarnă ouăle și amestecă ușor până se încheagă complet, dar rămân moi.","Adaugă roșia la final și servește cu pâine."],"m":"Ouăle trebuie făcute bine, fără părți lichide. Taie omleta fâșii pe care cel mic le poate ține în mână."},{"id":"tocanita","c":"ci","a":12,"b":36,"n":"Tocăniță de legume cu pui","t":45,"s":4,"i":[["pulpe de pui dezosate",350,"g","C"],["cartofi",300,"g","L"],["morcov",1,"buc","L"],["ardei gras",1,"buc","L"],["ceapă",0.5,"buc","L"],["passata de roșii",200,"ml","K"],["ulei de măsline",1,"lingură","K"],["pătrunjel",1,"lingură","L"]],"p":["Călește ceapa tocată în ulei, apoi adaugă puiul tăiat cuburi mici și rumenește-l ușor.","Adaugă morcovul, ardeiul și cartofii tăiați cuburi, plus passata și un pahar de apă.","Fierbe acoperit la foc mic 30 de minute, până totul e foarte moale.","Presară pătrunjel la final."],"m":"Pulpele rămân mai suculente decât pieptul și se mestecă mai ușor. Ardeiul decojit e mai ușor de mâncat."},{"id":"avocado","c":"ci","a":12,"b":36,"n":"Ou fiert cu avocado și pâine","t":12,"s":2,"i":[["ouă",2,"buc","D"],["avocado copt",1,"buc","L"],["pâine",2,"felii","P"],["lămâie",0.25,"buc","L"]],"p":["Fierbe ouăle 10 minute, apoi răcește-le în apă rece.","Pisează avocado cu câteva picături de lămâie.","Unge pâinea cu avocado și servește cu oul tăiat în bucăți mici."],"m":"Ouăle fierte tari se taie în sferturi sau bucăți mici, nu se dau întregi."},{"id":"musaca","c":"ci","a":12,"b":36,"n":"Musaca de cartofi cu carne","t":60,"s":5,"i":[["cartofi",700,"g","L"],["carne tocată de curcan sau vită",350,"g","C"],["ceapă",0.5,"buc","L"],["passata de roșii",150,"ml","K"],["ouă",2,"buc","D"],["iaurt",200,"g","D"],["ulei de măsline",1,"lingură","K"]],"p":["Fierbe cartofii feliați 8 minute, până sunt pe jumătate moi.","Călește ceapa și carnea în ulei, apoi adaugă passata și fierbe 10 minute.","Așază în tavă straturi de cartofi și carne, terminând cu cartofi.","Toarnă deasupra ouăle bătute cu iaurtul și coace la 190°C 30 de minute."],"m":"Se taie ușor în cuburi. Lasă-o 10 minute să se așeze înainte de tăiere."},{"id":"galuste-branza","c":"md","a":12,"b":36,"n":"Găluște leneșe de brânză","t":25,"s":3,"i":[["brânză de vaci",250,"g","D"],["ouă",1,"buc","D"],["făină",4,"lingură","P"],["unt",10,"g","D"],["smântână",2,"lingură","D"]],"p":["Amestecă brânza cu oul și făina până obții un aluat moale.","Fă un sul pe masa cu făină și taie-l în bucăți mici.","Fierbe găluștele în apă 3–4 minute după ce se ridică la suprafață.","Servește-le cu unt topit și smântână."],"m":"Au gust dulceag natural, de la brânză. Merg și cu fructe strivite în loc de smântână."},{"id":"hummus-paine","c":"gu","a":12,"b":36,"n":"Pâine cu hummus și castravete","t":10,"s":2,"i":[["năut fiert",200,"g","K"],["tahini",1,"lingură","K"],["lămâie",0.5,"buc","L"],["ulei de măsline",2,"lingură","K"],["pâine",2,"felii","P"],["castravete",0.5,"buc","L"]],"p":["Pasează năutul cu tahini, zeama de lămâie, uleiul și 2–3 linguri de apă.","Întinde hummusul pe pâine.","Rade castravetele deasupra și taie pâinea fâșii."],"m":"Tahiniul e din susan, unul dintre alergenii frecvenți. Dacă e prima dată, începe cu o cantitate mică."},{"id":"fasole-verde-pui","c":"ci","a":12,"b":36,"n":"Mâncare de fasole verde cu pui","t":40,"s":4,"i":[["fasole verde",400,"g","L"],["piept de pui",250,"g","C"],["ceapă",0.5,"buc","L"],["passata de roșii",200,"ml","K"],["usturoi",1,"cățel","L"],["mărar",1,"lingură","L"],["ulei de măsline",1,"lingură","K"]],"p":["Călește ceapa și puiul tăiat cuburi în ulei 5 minute.","Adaugă fasolea tăiată bucăți mici și un pahar de apă, fierbe 20 de minute.","Adaugă passata și usturoiul, fierbe încă 10 minute.","Presară mărar."],"m":"Taie fasolea în bucăți scurte. Păstăile lungi și întregi sunt greu de mestecat."},{"id":"mazare-pui","c":"pr","a":12,"b":36,"n":"Mâncare de mazăre cu pui","t":35,"s":4,"i":[["mazăre congelată",400,"g","L"],["pulpe de pui dezosate",250,"g","C"],["morcov",1,"buc","L"],["ceapă",0.5,"buc","L"],["passata de roșii",150,"ml","K"],["mărar",1,"lingură","L"],["ulei de măsline",1,"lingură","K"]],"p":["Călește ceapa, morcovul ras și puiul cuburi în ulei.","Adaugă mazărea și apă cât s-o acopere, fierbe 15 minute.","Adaugă passata și mai fierbe 10 minute.","Presară mărar și strivește ușor mazărea în porția celui mic."],"m":"Mazărea întreagă poate aluneca pe gât la cei mai mici. Strivește-o ușor cu furculița."},{"id":"chiftele-vita-sos","c":"ci","a":12,"b":36,"n":"Chifteluțe de vită în sos de roșii","t":45,"s":4,"i":[["carne tocată de vită",400,"g","C"],["ouă",1,"buc","D"],["pesmet",3,"lingură","P"],["ceapă",0.5,"buc","L"],["passata de roșii",400,"ml","K"],["pătrunjel",1,"lingură","L"],["ulei de măsline",1,"lingură","K"]],"p":["Amestecă carnea cu oul, pesmetul, ceapa rasă și pătrunjelul.","Formează chifteluțe mici și coace-le la 200°C 15 minute.","Fierbe passata 10 minute, adaugă chifteluțele și mai fierbe 10 minute.","Servește cu piure sau paste."],"m":"Sosul le face moi și mai ușor de mestecat decât chiftelele simple."},{"id":"frittata","c":"md","a":12,"b":36,"n":"Frittata cu cartofi și legume","t":30,"s":4,"i":[["ouă",4,"buc","D"],["cartof",1,"buc","L"],["ardei gras",0.5,"buc","L"],["spanac baby",30,"g","L"],["cașcaval ras",30,"g","D"],["lapte",50,"ml","D"],["ulei de măsline",1,"lingură","K"]],"p":["Fierbe cartoful cuburi mici 8 minute.","Călește ardeiul tocat și spanacul în ulei 3 minute, apoi adaugă cartoful.","Toarnă ouăle bătute cu laptele și brânza.","Coace la 180°C 15 minute, până e făcută în mijloc."],"m":"Se taie în triunghiuri sau bastonașe. Se poate pregăti seara și se servește rece la micul dejun."},{"id":"french-toast","c":"md","a":12,"b":36,"n":"Pâine prăjită în ou cu scorțișoară","t":10,"s":2,"i":[["pâine",2,"felii","P"],["ouă",1,"buc","D"],["lapte",50,"ml","D"],["scorțișoară",1,"vârf","K"],["unt",10,"g","D"],["fructe de pădure",60,"g","L"]],"p":["Bate oul cu laptele și scorțișoara.","Înmoaie feliile de pâine pe ambele părți.","Prăjește-le în unt, la foc mic, 2 minute pe fiecare parte.","Taie-le fâșii și servește cu fructe strivite."],"m":"Fără zahăr și fără sirop. Fructele strivite deasupra dau destulă dulceață."},{"id":"salata-fructe","c":"gu","a":12,"b":36,"n":"Salată de fructe tăiate mărunt","t":10,"s":2,"i":[["banană",1,"buc","L"],["kiwi",1,"buc","L"],["pară coaptă",1,"buc","L"],["struguri fără sâmburi",60,"g","L"],["iaurt",2,"lingură","D"]],"p":["Curăță fructele de coajă.","Taie strugurii în sferturi, pe lung.","Taie celelalte fructe cuburi mici și amestecă-le cu iaurtul."],"m":"Strugurii întregi sunt printre cele mai periculoase alimente pentru înecare. Taie-i mereu în sferturi."},{"id":"somon-cartof-dulce","c":"pr","a":12,"b":36,"n":"Somon la cuptor cu cartof dulce","t":35,"s":3,"i":[["file de somon",300,"g","C"],["cartof dulce",1,"buc","L"],["broccoli",150,"g","L"],["ulei de măsline",1,"lingură","K"],["lămâie",0.5,"buc","L"]],"p":["Taie cartoful dulce cuburi, amestecă-l cu ulei și coace-l la 200°C 15 minute.","Adaugă în tavă somonul și broccoliul și stropește cu lămâie.","Coace încă 15 minute.","Desfă somonul în fulgi și verifică oasele."],"m":"Totul se face într-o singură tavă. Pisează ușor cartoful dulce dacă e prea tare."},{"id":"ciorba-legume","c":"pr","a":12,"b":36,"n":"Ciorbă de legume","t":40,"s":5,"i":[["cartofi",2,"buc","L"],["morcov",1,"buc","L"],["fasole verde",100,"g","L"],["dovlecel",0.5,"buc","L"],["ardei gras",0.5,"buc","L"],["ceapă",0.5,"buc","L"],["passata de roșii",150,"ml","K"],["leuștean",1,"lingură","L"],["apă",1500,"ml","K"]],"p":["Fierbe ceapa, morcovul și cartofii tăiați cuburi mici 15 minute.","Adaugă fasolea, ardeiul și dovlecelul și fierbe încă 15 minute.","Pune passata și leușteanul.","Pune deoparte porția celui mic înainte să acrești și să sărezi."],"m":"Taie legumele în cuburi mici, cât unghia, ca să le poată mânca cu lingurița."},{"id":"pilaf-pui","c":"pr","a":12,"b":36,"n":"Pilaf cu pui și legume","t":35,"s":4,"i":[["orez",150,"g","P"],["pulpe de pui dezosate",250,"g","C"],["morcov",1,"buc","L"],["ardei gras",0.5,"buc","L"],["ceapă",0.5,"buc","L"],["ulei de măsline",1,"lingură","K"],["apă",450,"ml","K"]],"p":["Călește ceapa și puiul tăiat cuburi în ulei 5 minute.","Adaugă morcovul și ardeiul tăiate mărunt și orezul și amestecă 1 minut.","Toarnă apa, acoperă și fierbe la foc mic 20 de minute.","Lasă 5 minute acoperit înainte de servire."],"m":"Dacă orezul e prea tare pentru cel mic, mai adaugă puțină apă și fierbe încă 5 minute."},{"id":"briose-dovlecel","c":"gu","a":12,"b":36,"n":"Brioșe sărate cu dovlecel și brânză","t":35,"s":12,"i":[["dovlecel",1,"buc","L"],["ouă",2,"buc","D"],["făină",150,"g","P"],["cașcaval ras",60,"g","D"],["iaurt",100,"g","D"],["ulei",40,"ml","K"],["praf de copt",1,"linguriță","K"]],"p":["Încălzește cuptorul la 180°C.","Rade dovlecelul și stoarce-l bine.","Amestecă ouăle, iaurtul și uleiul, apoi adaugă dovlecelul, brânza, făina și praful de copt.","Împarte în 12 forme și coace 20–22 de minute."],"m":"Bune la pachet sau în parc. Se congelează și se dezgheață în câteva ore."},{"id":"paste-broccoli","c":"pr","a":12,"b":36,"n":"Paste cu broccoli și brânză","t":20,"s":3,"i":[["paste scurte",150,"g","P"],["broccoli",200,"g","L"],["cașcaval ras",50,"g","D"],["smântână",3,"lingură","D"],["unt",10,"g","D"]],"p":["Fierbe pastele, iar în ultimele 5 minute adaugă broccoliul tăiat mărunt.","Scurge-le, păstrând puțină apă de la fiert.","Amestecă cu untul, smântâna, brânza și o lingură de apă, până se face un sos cremos."],"m":"Broccoliul fiert cu pastele se înmoaie destul ca să poată fi strivit cu limba."},{"id":"dovlecei-umpluti","c":"ci","a":18,"b":36,"n":"Dovlecei umpluți la cuptor","t":50,"s":4,"i":[["dovlecei",2,"buc","L"],["carne tocată de curcan",250,"g","C"],["orez",2,"lingură","P"],["ceapă",0.5,"buc","L"],["passata de roșii",200,"ml","K"],["mărar",1,"lingură","L"],["cașcaval ras",40,"g","D"]],"p":["Taie dovleceii în jumătăți pe lung și scobește-i.","Amestecă carnea cu orezul, ceapa rasă, mărarul și miezul tocat.","Umple dovleceii, pune-i în tavă și toarnă passata în jur.","Coace la 190°C 35 de minute, presară brânza și mai coace 5 minute."],"m":"Pentru cel mic, scoate umplutura și taie dovlecelul în bucăți mici."},{"id":"quesadilla","c":"ci","a":18,"b":36,"n":"Quesadilla cu brânză și fasole","t":15,"s":2,"i":[["lipii",2,"buc","P"],["fasole roșie fiartă",100,"g","K"],["cașcaval ras",60,"g","D"],["porumb",2,"lingură","L"],["ardei gras",0.25,"buc","L"]],"p":["Pisează fasolea cu furculița.","Întinde-o pe o lipie, presară brânza, porumbul și ardeiul tocat mărunt.","Acoperă cu a doua lipie și coace în tigaie uscată 2–3 minute pe fiecare parte.","Taie în triunghiuri mici."],"m":"Lasă-o să se răcească: brânza topită rămâne fierbinte mult timp în interior."},{"id":"peste-pane","c":"ci","a":18,"b":36,"n":"Bastonașe de pește la cuptor","t":30,"s":4,"i":[["file de cod",400,"g","C"],["ouă",1,"buc","D"],["pesmet",60,"g","P"],["făină",2,"lingură","P"],["ulei de măsline",1,"lingură","K"],["lămâie",0.5,"buc","L"]],"p":["Încălzește cuptorul la 200°C.","Taie peștele în bastonașe și verifică oasele.","Trece-le prin făină, ou și pesmet.","Așază-le în tavă, stropește cu ulei și coace 15–18 minute."],"m":"Varianta de casă are mult mai puțină sare decât cele congelate din magazin."},{"id":"nuggets-pui","c":"ci","a":18,"b":36,"n":"Nuggets de pui la cuptor","t":35,"s":4,"i":[["piept de pui",400,"g","C"],["ouă",1,"buc","D"],["fulgi de porumb neîndulciți",60,"g","P"],["parmezan ras",20,"g","D"],["boia dulce",1,"vârf","K"],["ulei de măsline",1,"lingură","K"]],"p":["Încălzește cuptorul la 200°C.","Sfărâmă fulgii de porumb și amestecă-i cu parmezanul și boiaua.","Taie puiul bucăți, trece-le prin ou și apoi prin fulgi.","Coace 18–20 de minute, întorcându-le o dată."],"m":"Taie puiul în bucăți mici și subțiri, ca să se coacă uniform și să rămână moale."},{"id":"clatite-branza","c":"md","a":24,"b":36,"n":"Clătite subțiri cu brânză","t":30,"s":4,"i":[["făină",150,"g","P"],["lapte",300,"ml","D"],["ouă",2,"buc","D"],["ulei",1,"lingură","K"],["brânză de vaci",250,"g","D"],["smântână",2,"lingură","D"],["coajă de lămâie",1,"vârf","L"]],"p":["Amestecă făina, laptele, ouăle și uleiul până obții un aluat fluid.","Coace clătite subțiri în tigaie încinsă.","Amestecă brânza cu smântâna și coaja de lămâie.","Umple clătitele, rulează-le și taie-le în bucăți."],"m":"Fără zahăr în umplutură. Dacă vrei să fie mai dulci, adaugă banană pisată."},{"id":"pizza-lipie","c":"ci","a":24,"b":36,"n":"Pizza pe lipie cu legume","t":20,"s":2,"i":[["lipii",2,"buc","P"],["passata de roșii",4,"lingură","K"],["mozzarella",100,"g","D"],["ardei gras",0.5,"buc","L"],["ciuperci",2,"buc","L"],["porumb",2,"lingură","L"],["oregano",1,"vârf","K"]],"p":["Încălzește cuptorul la 200°C.","Întinde passata pe lipii și presară oregano.","Pune mozzarella și legumele tăiate mărunt.","Coace 8–10 minute, apoi taie în fâșii."],"m":"Lasă-l pe cel mic să-și pună singur legumele pe pizza. Copiii mănâncă mai ușor ce au gătit ei."},{"id":"wrap-pui","c":"ci","a":24,"b":36,"n":"Wrap cu pui și legume","t":20,"s":2,"i":[["lipii",2,"buc","P"],["piept de pui",200,"g","C"],["castravete",0.5,"buc","L"],["roșie",1,"buc","L"],["iaurt grecesc",3,"lingură","D"],["salată verde",2,"buc","L"]],"p":["Taie puiul fâșii subțiri și coace-l în tigaie cu puțin ulei, 6–8 minute.","Taie legumele mărunt și amestecă iaurtul cu puțin mărar.","Întinde iaurtul pe lipie, adaugă puiul și legumele.","Rulează strâns și taie în roți."],"m":"Roțile de wrap sunt mai ușor de ținut decât un rulou întreg."},{"id":"tartine-branza","c":"gu","a":12,"b":36,"n":"Tartine cu brânză de vaci și castravete","t":5,"s":2,"i":[["pâine",2,"felii","P"],["brânză de vaci",80,"g","D"],["mărar",1,"lingură","L"],["castravete",0.25,"buc","L"]],"p":["Amestecă brânza cu mărarul tocat.","Întinde-o pe pâine.","Rade castravetele deasupra și taie feliile fâșii."],"m":"Castravetele ras e mai sigur decât rondelele, care pot aluneca pe gât."},{"id":"banana-arahide","c":"gu","a":12,"b":36,"n":"Banană cu unt de arahide","t":3,"s":1,"i":[["banană",1,"buc","L"],["unt de arahide fin, fără zahăr",1,"linguriță","K"]],"p":["Taie banana pe lung, apoi în bucăți.","Întinde un strat foarte subțire de unt de arahide pe bucăți."],"m":"Doar strat subțire: untul de arahide gros se lipește de cerul gurii. Arahidele sunt alergen frecvent, dacă e prima dată începe cu puțin."},{"id":"jumari-mazare","c":"md","a":12,"b":36,"n":"Ouă jumări cu mazăre","t":8,"s":2,"i":[["ouă",2,"buc","D"],["mazăre congelată",50,"g","L"],["unt",5,"g","D"]],"p":["Fierbe mazărea 3 minute și strivește-o ușor.","Topește untul, adaugă ouăle bătute și mazărea.","Amestecă la foc mic până ouăle sunt complet făcute."],"m":"Mazărea strivită nu mai alunecă pe gât. E un mic dejun cu proteine gata în câteva minute."},{"id":"lipie-ou-branza","c":"md","a":12,"b":36,"n":"Lipie cu ou și brânză","t":8,"s":1,"i":[["lipie",1,"buc","P"],["ouă",1,"buc","D"],["cașcaval ras",20,"g","D"]],"p":["Bate oul și toarnă-l într-o tigaie unsă, la foc mic.","Pune imediat lipia peste ou și apasă ușor.","După un minut întoarce totul, presară brânza pe jumătate și pliază.","Taie în triunghiuri mici."],"m":"Lasă-o să se răcească puțin, brânza topită rămâne fierbinte."},{"id":"cuscus-legume","c":"pr","a":12,"b":36,"n":"Cușcuș cu mazăre și porumb","t":10,"s":2,"i":[["cușcuș",80,"g","P"],["apă fierbinte",120,"ml","K"],["mazăre congelată",50,"g","L"],["porumb",2,"lingură","L"],["unt",10,"g","D"]],"p":["Fierbe mazărea și porumbul 3 minute.","Toarnă apa fierbinte peste cușcuș, acoperă și lasă 5 minute.","Afânează cu furculița și amestecă legumele și untul."],"m":"Cușcușul e moale și ușor de mestecat. Strivește mazărea pentru cei mai mici."},{"id":"paste-unt-parmezan","c":"pr","a":12,"b":36,"n":"Paste cu unt, parmezan și mazăre","t":10,"s":2,"i":[["paste mici",100,"g","P"],["mazăre congelată",60,"g","L"],["unt",10,"g","D"],["parmezan ras",20,"g","D"]],"p":["Fierbe pastele, iar în ultimele 3 minute adaugă mazărea.","Scurge, păstrând o lingură de apă.","Amestecă cu untul, parmezanul și apa până se face cremos."],"m":"Parmezanul aduce gust fără să mai adaugi sare."},{"id":"branza-fructe","c":"gu","a":12,"b":36,"n":"Brânză de vaci cu căpșuni","t":5,"s":1,"i":[["brânză de vaci",100,"g","D"],["căpșuni",4,"buc","L"],["fulgi fini de ovăz",1,"lingură","P"]],"p":["Taie căpșunile bucăți mici sau strivește-le.","Amestecă-le cu brânza și presară fulgii."],"m":"Iarna merg și căpșuni congelate, dezghețate și strivite."},{"id":"smoothie-bowl","c":"md","a":12,"b":36,"n":"Bol de banană și afine cu iaurt","t":5,"s":1,"i":[["banană",1,"buc","L"],["afine",40,"g","L"],["iaurt grecesc",100,"g","D"],["fulgi fini de ovăz",1,"lingură","P"]],"p":["Pasează banana cu afinele și iaurtul până e cremos.","Toarnă în bol și presară fulgii."],"m":"Se mănâncă cu lingurița, nu se bea, așa că rămâne sățios."},{"id":"ton-paste","c":"pr","a":12,"b":36,"n":"Paste cu ton și porumb","t":12,"s":2,"i":[["paste mici",100,"g","P"],["ton în apă",1,"conservă","C"],["porumb",2,"lingură","L"],["iaurt grecesc",2,"lingură","D"]],"p":["Fierbe pastele până sunt moi.","Scurge tonul și desfă-l cu furculița.","Amestecă pastele cu tonul, porumbul și iaurtul."],"m":"Tonul e bun cel mult o dată pe săptămână la cei mici, din cauza mercurului. Alege-l în apă, nu în ulei sau cu sare."},{"id":"linte-legume","c":"pr","a":12,"b":36,"n":"Mâncare de linte cu legume","t":30,"s":4,"i":[["linte verde sau brună",150,"g","K"],["morcov",1,"buc","L"],["ceapă",0.5,"buc","L"],["ardei gras",0.5,"buc","L"],["passata de roșii",200,"ml","K"],["ulei de măsline",1,"lingură","K"],["cimbru",1,"vârf","K"]],"p":["Fierbe lintea 20 de minute și scurge-o.","Călește ceapa, morcovul și ardeiul tăiate mărunt în ulei.","Adaugă lintea, passata, cimbrul și un pahar de apă, fierbe 10 minute.","Strivește ușor porția celui mic."],"m":"Lintea are mult fier. Servită cu o legumă bogată în vitamina C (ardei, roșii), fierul se absoarbe mai bine."},{"id":"iahnie-fasole","c":"pr","a":12,"b":36,"n":"Iahnie de fasole","t":20,"s":4,"i":[["fasole albă fiartă",400,"g","K"],["ceapă",0.5,"buc","L"],["morcov",1,"buc","L"],["passata de roșii",150,"ml","K"],["ulei de măsline",1,"lingură","K"],["cimbru",1,"vârf","K"]],"p":["Călește ceapa și morcovul ras în ulei 5 minute.","Adaugă fasolea clătită, passata, cimbrul și puțină apă.","Fierbe 10 minute, apoi pisează o parte din fasole ca să se îngroașe.","Pentru cel mic strivește fasolea cu furculița."],"m":"Fasolea din conservă trebuie clătită bine, are sare. Coaja boabelor se strivește ușor după fierbere."},{"id":"conopida-gratinata","c":"ci","a":12,"b":36,"n":"Conopidă gratinată cu brânză","t":35,"s":4,"i":[["conopidă",1,"buc","L"],["lapte",200,"ml","D"],["făină",1,"lingură","P"],["unt",15,"g","D"],["cașcaval ras",60,"g","D"]],"p":["Fierbe buchețelele de conopidă 8 minute, până sunt moi.","Topește untul, adaugă făina și apoi laptele, amestecând până se îngroașă.","Pune conopida în tavă, toarnă sosul și presară brânza.","Coace la 200°C 15 minute."],"m":"Conopida fiartă bine se strivește ușor. Mulți copii o acceptă mai ușor cu brânză."},{"id":"ficatei-piure","c":"ci","a":12,"b":36,"n":"Ficăței de pui cu piure","t":25,"s":3,"i":[["ficăței de pui",200,"g","C"],["ceapă",0.5,"buc","L"],["cartofi",400,"g","L"],["lapte",80,"ml","D"],["unt",15,"g","D"],["ulei de măsline",1,"lingură","K"]],"p":["Fierbe cartofii și pisează-i cu laptele și jumătate din unt.","Curăță ficățeii de pielițe și taie-i bucăți mici.","Călește ceapa în ulei, adaugă ficățeii și gătește 6–8 minute, până nu mai sunt roz în interior.","Toacă-i mărunt și amestecă-i cu puțin piure."],"m":"Ficatul are mult fier, dar și multă vitamina A, așa că e bine cel mult o dată pe săptămână."},{"id":"curry-pui","c":"pr","a":12,"b":36,"n":"Curry blând de pui cu lapte de cocos","t":30,"s":4,"i":[["piept de pui",300,"g","C"],["lapte de cocos",200,"ml","K"],["morcov",1,"buc","L"],["mazăre congelată",80,"g","L"],["ceapă",0.5,"buc","L"],["turmeric",0.5,"linguriță","K"],["orez",150,"g","P"]],"p":["Călește ceapa tocată, apoi adaugă puiul tăiat cuburi mici și turmericul.","Adaugă morcovul ras și laptele de cocos, fierbe 15 minute.","Pune mazărea în ultimele 5 minute.","Servește cu orez fiert moale."],"m":"Fără ardei iute. Turmericul și cocosul dau gust și culoare, fără să fie picant."},{"id":"lasagna-legume","c":"ci","a":12,"b":36,"n":"Lasagna cu legume și ricotta","t":60,"s":6,"i":[["foi de lasagna",9,"buc","P"],["dovlecel",1,"buc","L"],["morcov",2,"buc","L"],["spanac baby",100,"g","L"],["ricotta",250,"g","D"],["passata de roșii",500,"ml","K"],["mozzarella",125,"g","D"]],"p":["Rade dovlecelul și morcovii și călește-i cu spanacul 5 minute.","Amestecă legumele cu ricotta.","În tavă pune straturi: passata, foi, legume cu ricotta, repetă de trei ori.","Termină cu passata și mozzarella și coace la 190°C 35 de minute."],"m":"Lasă lasagna 10 minute înainte de tăiere. Se congelează bine în porții."},{"id":"clatite-dovleac","c":"md","a":12,"b":36,"n":"Clătite pufoase cu dovleac","t":20,"s":3,"i":[["piure de dovleac copt",150,"g","L"],["ouă",2,"buc","D"],["făină",80,"g","P"],["lapte",80,"ml","D"],["scorțișoară",1,"vârf","K"],["praf de copt",0.5,"linguriță","K"]],"p":["Amestecă dovleacul cu ouăle și laptele.","Adaugă făina, praful de copt și scorțișoara.","Coace clătite mici în tigaie unsă, 2 minute pe fiecare parte."],"m":"Dovleacul le face dulci natural. Se pot congela și reîncălzi în prăjitor."},{"id":"terci-mei","c":"md","a":12,"b":36,"n":"Terci de mei cu pară","t":20,"s":2,"i":[["mei",60,"g","P"],["lapte",300,"ml","D"],["pară coaptă",1,"buc","L"],["scorțișoară",1,"vârf","K"]],"p":["Clătește meiul bine.","Fierbe-l în lapte la foc mic 15–18 minute, amestecând des.","Adaugă para rasă și scorțișoara."],"m":"Meiul nu are gluten și dă varietate față de ovăz."},{"id":"hrisca-legume","c":"pr","a":12,"b":36,"n":"Hrișcă cu legume și ou","t":25,"s":3,"i":[["hrișcă",100,"g","P"],["morcov",1,"buc","L"],["dovlecel",0.5,"buc","L"],["ouă",2,"buc","D"],["unt",10,"g","D"]],"p":["Fierbe hrișca în dublul cantității de apă 15 minute.","Călește în unt morcovul și dovlecelul rase.","Amestecă hrișca cu legumele.","Servește cu ou fiert tare tăiat mărunt."],"m":"Hrișca are gust de nucă și multe minerale. Dacă e prea tare, mai fierbe-o cu puțină apă."},{"id":"falafel-cuptor","c":"ci","a":18,"b":36,"n":"Falafel la cuptor cu iaurt","t":35,"s":4,"i":[["năut fiert",400,"g","K"],["pătrunjel",2,"lingură","L"],["usturoi",1,"cățel","L"],["făină",2,"lingură","P"],["chimion",0.5,"linguriță","K"],["ulei de măsline",2,"lingură","K"],["iaurt grecesc",100,"g","D"]],"p":["Pasează năutul cu pătrunjelul, usturoiul, chimionul și făina, fără să devină pastă fină.","Formează chiftele mici turtite.","Unge-le cu ulei și coace la 200°C 20 de minute, întorcându-le o dată.","Servește cu iaurt."],"m":"Turtite sunt mai ușor de mușcat decât bilele rotunde."},{"id":"porc-piure-mazare","c":"ci","a":12,"b":36,"n":"Mușchi de porc cu piure de mazăre","t":30,"s":3,"i":[["mușchi de porc",250,"g","C"],["mazăre congelată",250,"g","L"],["cartof",1,"buc","L"],["unt",15,"g","D"],["ulei de măsline",1,"lingură","K"]],"p":["Fierbe cartoful și mazărea 12 minute, apoi pisează-le cu untul.","Taie mușchiul felii subțiri și bate-le ușor.","Gătește-le în tigaie cu ulei 3 minute pe fiecare parte, până sunt făcute complet.","Taie carnea fâșii foarte subțiri."],"m":"Mușchiul e cea mai moale bucată de porc. Fâșiile subțiri se mestecă mai ușor decât cuburile."},{"id":"gnocchi-rosii","c":"pr","a":18,"b":36,"n":"Gnocchi cu sos de roșii și mozzarella","t":20,"s":3,"i":[["gnocchi",400,"g","P"],["passata de roșii",300,"ml","K"],["mozzarella",60,"g","D"],["busuioc uscat",1,"vârf","K"],["ulei de măsline",1,"lingură","K"]],"p":["Fierbe passata cu uleiul și busuiocul 10 minute.","Fierbe gnocchi până se ridică la suprafață.","Amestecă-i cu sosul și mozzarella ruptă bucăți."],"m":"Taie fiecare gnocchi în două pentru cel mic, sunt moi dar lipicioși."},{"id":"ardei-umpluti","c":"ci","a":18,"b":36,"n":"Ardei umpluți la cuptor","t":60,"s":4,"i":[["ardei grași",4,"buc","L"],["carne tocată de vită",300,"g","C"],["orez",50,"g","P"],["ceapă",0.5,"buc","L"],["passata de roșii",300,"ml","K"],["mărar",1,"lingură","L"],["smântână",3,"lingură","D"]],"p":["Amestecă carnea cu orezul, ceapa rasă și mărarul.","Umple ardeii scobiți și pune-i în tavă.","Toarnă passata și un pahar de apă, acoperă cu folie.","Coace la 190°C 45 de minute și servește cu smântână."],"m":"Pentru cel mic, scoate umplutura și decojește ardeiul, coaja e greu de mestecat."},{"id":"pilaf-bulgur","c":"pr","a":12,"b":36,"n":"Bulgur cu năut și legume","t":25,"s":3,"i":[["bulgur",100,"g","P"],["năut fiert",150,"g","K"],["morcov",1,"buc","L"],["roșie",1,"buc","L"],["ulei de măsline",1,"lingură","K"],["pătrunjel",1,"lingură","L"]],"p":["Călește morcovul ras în ulei, apoi adaugă roșia decojită tăiată mărunt.","Pune bulgurul și 250 ml apă, fierbe acoperit 12 minute.","Adaugă năutul strivit ușor și pătrunjelul."],"m":"Strivește năutul pentru cei mici, boabele întregi sunt tari și rotunde."},{"id":"supa-broccoli","c":"pr","a":12,"b":36,"n":"Supă cremă de broccoli","t":25,"s":4,"i":[["broccoli",400,"g","L"],["cartof",1,"buc","L"],["ceapă",0.5,"buc","L"],["apă",700,"ml","K"],["cașcaval ras",40,"g","D"],["ulei de măsline",1,"lingură","K"]],"p":["Călește ceapa în ulei, adaugă cartoful tăiat și apa.","După 10 minute adaugă broccoliul și fierbe încă 8 minute.","Pasează fin și amestecă brânza."],"m":"Nu fierbe broccoliul prea mult, rămâne verde și cu gust mai blând."},{"id":"supa-linte-rosie","c":"pr","a":12,"b":36,"n":"Supă de linte roșie cu lămâie","t":30,"s":4,"i":[["linte roșie",120,"g","K"],["morcov",1,"buc","L"],["ceapă",0.5,"buc","L"],["chimion",0.5,"linguriță","K"],["apă",900,"ml","K"],["lămâie",0.5,"buc","L"],["ulei de măsline",1,"lingură","K"]],"p":["Călește ceapa și morcovul în ulei cu chimionul.","Adaugă lintea clătită și apa, fierbe 20 de minute.","Pasează și adaugă zeama de lămâie."],"m":"Supă groasă, sățioasă, care se poate mânca și cu bucăți de pâine înmuiate."},{"id":"parjoale-legume","c":"ci","a":12,"b":36,"n":"Pârjoale de legume la cuptor","t":35,"s":4,"i":[["dovlecel",1,"buc","L"],["morcov",1,"buc","L"],["cartofi",2,"buc","L"],["ouă",1,"buc","D"],["cașcaval ras",50,"g","D"],["fulgi fini de ovăz",4,"lingură","P"],["mărar",1,"lingură","L"]],"p":["Rade legumele și stoarce-le bine de apă.","Amestecă-le cu oul, brânza, fulgii și mărarul.","Formează pârjoale mici și turtite pe hârtie de copt.","Coace la 200°C 20–25 de minute, întorcându-le o dată."],"m":"Bune și reci, la pachet. Merg cu iaurt cu mărar."},{"id":"briose-morcov","c":"gu","a":12,"b":36,"n":"Brioșe cu morcov și măr","t":30,"s":12,"i":[["morcov",1,"buc","L"],["măr",1,"buc","L"],["ouă",2,"buc","D"],["făină integrală",150,"g","P"],["iaurt",100,"g","D"],["ulei",40,"ml","K"],["praf de copt",1,"linguriță","K"]],"p":["Încălzește cuptorul la 180°C.","Rade morcovul și mărul.","Amestecă ouăle, iaurtul și uleiul, apoi adaugă restul.","Împarte în 12 forme și coace 20 de minute."],"m":"Fără zahăr. Mărul și morcovul le îndulcesc suficient."},{"id":"bile-ovaz","c":"gu","a":18,"b":36,"n":"Biluțe de ovăz și curmale","t":10,"s":12,"i":[["curmale fără sâmburi",8,"buc","K"],["fulgi fini de ovăz",60,"g","P"],["unt de arahide fin",1,"lingură","K"]],"p":["Înmoaie curmalele 10 minute în apă caldă și scurge-le.","Pasează-le cu fulgii și untul de arahide până se leagă.","Formează biluțe mici și turtește-le ușor."],"m":"Turtește-le ca pe niște biscuiți, bilele tari și rotunde pot fi greu de mestecat. Curmalele sunt dulci, dă-le ocazional."},{"id":"spanac-ou","c":"pr","a":12,"b":36,"n":"Mâncare de spanac cu ou","t":20,"s":3,"i":[["spanac",400,"g","L"],["usturoi",1,"cățel","L"],["lapte",100,"ml","D"],["făină",1,"lingură","P"],["unt",10,"g","D"],["ouă",3,"buc","D"]],"p":["Opărește spanacul și toacă-l mărunt.","Topește untul, adaugă făina și laptele, apoi spanacul și usturoiul, și fierbe 5 minute.","Fierbe ouăle tari separat.","Servește spanacul cu ou tăiat mărunt și piure sau pâine."],"m":"Spanacul tocat fin în sos e mult mai ușor de mâncat decât frunzele întregi."},{"id":"supa-grec","c":"pr","a":12,"b":36,"n":"Supă a la grec cu pui și orez","t":35,"s":4,"i":[["piept de pui",200,"g","C"],["orez",50,"g","P"],["morcov",1,"buc","L"],["ouă",1,"buc","D"],["lămâie",0.5,"buc","L"],["apă",1200,"ml","K"],["pătrunjel",1,"lingură","L"]],"p":["Fierbe puiul cu morcovul 20 de minute, apoi scoate-l și mărunțește-l.","Adaugă orezul în supă și fierbe 15 minute.","Bate oul cu zeama de lămâie, adaugă un polonic de supă, apoi toarnă amestecul înapoi, amestecând, fără să mai fiarbă.","Pune carnea înapoi și pătrunjelul."],"m":"Oul se gătește complet cu supa fierbinte. Supa trebuie încinsă bine după ce îl adaugi."},{"id":"mini-burger","c":"ci","a":24,"b":36,"n":"Mini burgeri de vită","t":25,"s":4,"i":[["carne tocată de vită",300,"g","C"],["ouă",1,"buc","D"],["pesmet",2,"lingură","P"],["chifle mici",4,"buc","P"],["roșie",1,"buc","L"],["salată verde",2,"buc","L"],["cașcaval",4,"felii","D"]],"p":["Amestecă carnea cu oul și pesmetul și formează 4 burgeri mici, subțiri.","Gătește-i în tigaie 4 minute pe fiecare parte, până nu mai sunt roz.","Pune cașcavalul deasupra în ultimul minut.","Asamblează cu roșie și salată în chifle și taie în sferturi."],"m":"Burgerul trebuie făcut complet, fără roz la mijloc. Tăiat în sferturi e mai ușor de ținut."},{"id":"pulpe-cuptor-legume","c":"ci","a":12,"b":36,"n":"Pulpe de pui la cuptor cu legume","t":50,"s":4,"i":[["pulpe de pui dezosate",400,"g","C"],["cartofi",400,"g","L"],["morcov",2,"buc","L"],["dovlecel",1,"buc","L"],["ulei de măsline",2,"lingură","K"],["boia dulce",1,"linguriță","K"],["cimbru",1,"vârf","K"]],"p":["Taie legumele bucăți și puiul cuburi mari.","Amestecă totul în tavă cu uleiul, boiaua și cimbrul.","Coace la 200°C 40 de minute, amestecând o dată.","Mărunțește carnea și legumele pentru cel mic."],"m":"Totul într-o singură tavă, pentru toată familia. Sărează doar porțiile adulților."},{"id":"tocana-curcan-ciuperci","c":"ci","a":12,"b":36,"n":"Tocăniță de curcan cu ciuperci","t":35,"s":4,"i":[["piept de curcan",350,"g","C"],["ciuperci",200,"g","L"],["ceapă",0.5,"buc","L"],["smântână",100,"g","D"],["ulei de măsline",1,"lingură","K"],["mărar",1,"lingură","L"],["paste mici sau orez",150,"g","P"]],"p":["Călește ceapa, apoi adaugă curcanul tăiat cuburi mici.","Adaugă ciupercile tăiate mărunt și un pahar de apă, fierbe 20 de minute.","Pune smântâna și mărarul.","Servește cu paste sau orez."],"m":"Taie ciupercile foarte mărunt, sunt alunecoase și elastice."}];
const CAT={md:"Mic dejun",pr:"Prânz",ci:"Cină",gu:"Gustare"};
const G={L:"Legume și fructe",C:"Carne și pește",D:"Lactate și ouă",P:"Cereale, paste, pâine",K:"Cămară"};
const AGES=[{k:"6",n:"6–8 luni",a:6,b:8},{k:"9",n:"9–11 luni",a:9,b:11},{k:"12",n:"1 an",a:12,b:17},{k:"18",n:"1 an și 6 luni",a:18,b:23},{k:"24",n:"2–3 ani",a:24,b:36}];
const byId=Object.fromEntries(R.map(r=>[r.id,r]));
const WD=["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"];
const MO=["ian","feb","mar","apr","mai","iun","iul","aug","sep","oct","nov","dec"];

const store={get(k,d){try{const v=localStorage.getItem("fm2-"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("fm2-"+k,JSON.stringify(v))}catch(e){}}};

let ageK=store.get("age","18"); if(!AGES.find(a=>a.k===ageK))ageK="18";
let plan=store.get("plan",{}); let checks=store.get("checks",{});
let filter="all",query="",shopScope="all";
let maxT=store.get("maxT",0),maxI=store.get("maxI",0);
const TOPT=[[0,"Oricât"],[10,"≤ 10 min"],[20,"≤ 20 min"],[30,"≤ 30 min"],[45,"≤ 45 min"]];
const IOPT=[[0,"Oricâte"],[3,"≤ 3"],[5,"≤ 5"],[7,"≤ 7"]];
const age=()=>AGES.find(a=>a.k===ageK);
const fits=(r,g=age())=>r.a<=g.b&&r.b>=g.a;
const img=id=>"img/"+id+".jpg";

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function days(){const out=[],t=new Date();t.setHours(12,0,0,0);for(let i=0;i<7;i++){const d=new Date(t);d.setDate(t.getDate()+i);out.push({k:iso(d),i,
  name:i===0?"Azi":i===1?"Mâine":WD[d.getDay()],long:WD[d.getDay()]+", "+d.getDate()+" "+MO[d.getMonth()]})}return out}
function prune(){const keep=new Set(days().map(d=>d.k));Object.keys(plan).forEach(k=>{if(!keep.has(k)||!plan[k].length)delete plan[k];else plan[k]=plan[k].filter(id=>byId[id])})}
prune();
function save(){store.set("plan",plan);store.set("checks",checks);updateBadge()}

const FR={0.25:"¼",0.5:"½",0.75:"¾"};
function fmt(q,u){
  if(q==null)return"";
  let s;
  if(u==="g"||u==="ml"){s=q>=100?String(Math.round(q/10)*10):String(Math.round(q/5)*5||Math.round(q))}
  else{const r=Math.round(q*4)/4,w=Math.floor(r),f=+(r-w).toFixed(2);s=(w?w:"")+(FR[f]||"");if(!s)s="¼"}
  const plural={"felii":"felii","conservă":"conserve","cățel":"căței","lingură":"linguri","linguriță":"lingurițe","vârf":"vârfuri"};
  const unit=(q>1.01&&plural[u])?plural[u]:u;
  return s+" "+(u==="vârf"?unit+" de cuțit":unit);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const imgTag=(id,cls,alt)=>`<img class="${cls}" src="${img(id)}" alt="${esc(alt||"")}" loading="lazy" onerror="this.style.visibility='hidden'">`;

/* ---------- Age picker ---------- */
function renderAge(){
  const el=document.getElementById("age");
  el.innerHTML=AGES.map(a=>`<button class="chip" data-k="${a.k}" aria-pressed="${a.k===ageK}">${a.n}</button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ageK=b.dataset.k;store.set("age",ageK);renderAge();route()});
}

/* ---------- Filtre durată / ingrediente ---------- */
function filtersHTML(){return `<div class="filters"><div class="frow"><span class="lbl">Durată</span><div class="chips" data-g="t">${TOPT.map(([v,n])=>`<button class="chip" data-v="${v}" aria-pressed="${maxT===v}">${n}</button>`).join("")}</div></div>
<div class="frow"><span class="lbl">Ingrediente</span><div class="chips" data-g="i">${IOPT.map(([v,n])=>`<button class="chip" data-v="${v}" aria-pressed="${maxI===v}">${n}</button>`).join("")}</div></div></div>`}
function bindFilters(root,onChange){root.querySelectorAll(".filters .chips").forEach(g=>g.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const v=+b.dataset.v;
  if(g.dataset.g==="t"){maxT=v;store.set("maxT",v)}else{maxI=v;store.set("maxI",v)}
  g.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));onChange()}))}

/* ---------- Rețete ---------- */
function plannedDays(id){return days().filter(d=>(plan[d.k]||[]).includes(id))}
function renderRetete(){
  const v=document.getElementById("v-retete");
  v.innerHTML=`<input id="q" class="search" type="search" placeholder="Caută o rețetă sau un ingredient" value="${esc(query)}" aria-label="Caută">
  <div class="chips" role="group" aria-label="Filtru">${[["all","Toate"],["md","Mic dejun"],["pr","Prânz"],["ci","Cină"],["gu","Gustări"]].map(([k,n])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${n}</button>`).join("")}</div>
  ${filtersHTML()}
  <p class="muted count" id="cnt"></p>
  <div class="grid" id="rl"></div>`;
  bindFilters(v,renderList);
  v.querySelector("#q").addEventListener("input",e=>{query=e.target.value;renderList()});
  v.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;v.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));renderList()});
  renderList();
}
function matches(r,q,f){q=q.trim().toLowerCase();return fits(r)&&(f==="all"||r.c===f)&&(!maxT||r.t<=maxT)&&(!maxI||r.i.length<=maxI)&&(!q||r.n.toLowerCase().includes(q)||r.i.some(x=>x[0].toLowerCase().includes(q)))}
function renderList(){
  const items=R.filter(r=>matches(r,query,filter));
  document.getElementById("cnt").textContent=items.length+(items.length===1?" rețetă":" rețete")+" pentru "+age().n+(maxT?", maxim "+maxT+" minute":"")+(maxI?", maxim "+maxI+" ingrediente":"");
  const el=document.getElementById("rl");
  el.innerHTML=items.length?items.map(r=>{const pd=plannedDays(r.id);return`<button class="rcard" data-id="${r.id}">${imgTag(r.id,"ph",r.n)}
    ${pd.length?`<span class="pin">${pd.length===1?pd[0].name:"în "+pd.length+" zile"}</span>`:""}
    <span class="body"><span class="meta"><span class="tx-${r.c}">${CAT[r.c]}</span><span class="t">${r.t} min · ${r.i.length} ingr.</span></span><h3>${r.n}</h3></span></button>`}).join("")
    :`<div class="empty" style="grid-column:1/-1">Nicio rețetă nu se potrivește tuturor filtrelor. Încearcă mai multe minute sau mai multe ingrediente.</div>`;
  el.querySelectorAll(".rcard").forEach(b=>b.onclick=()=>openRecipe(b.dataset.id));
}

/* ---------- Planul meu ---------- */
function renderPlan(){
  const v=document.getElementById("v-plan"),ds=days();
  const total=ds.reduce((s,d)=>s+(plan[d.k]||[]).length,0);
  v.innerHTML=`<div class="toolbar"><div><h2>Planul meu</h2><p class="muted">Alege rețetele care îți plac pentru fiecare zi. Ingredientele apar automat la Cumpărături.</p></div></div>
  <div class="toolbar"><button class="btn ghost small" id="auto">Completează zilele goale</button>${total?`<button class="btn ghost small" id="clear">Golește planul</button>`:""}</div>
  ${ds.map(d=>{const ids=plan[d.k]||[];return`<div class="day"><div class="day-h"><div class="d"><h3 class="${d.i===0?"today":""}">${d.name}</h3><small>${d.long}</small></div>
    <button class="btn small" data-add="${d.k}">+ Adaugă</button></div>
    ${ids.length?ids.map(id=>{const r=byId[id];return`<div class="prow">${imgTag(id,"",r.n)}<button class="nm" data-id="${id}"><b>${r.n}</b><span class="tx-${r.c}">${CAT[r.c]}${fits(r)?"":" · altă vârstă"}</span></button><button class="x" data-rm="${d.k}|${id}" aria-label="Scoate ${esc(r.n)}">×</button></div>`}).join("")
      :`<div class="none">Nimic ales încă.</div>`}</div>`}).join("")}`;
  v.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openPicker(b.dataset.add));
  v.querySelectorAll(".prow .nm").forEach(b=>b.onclick=()=>openRecipe(b.dataset.id));
  v.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const[k,id]=b.dataset.rm.split("|");plan[k]=(plan[k]||[]).filter(x=>x!==id);if(!plan[k].length)delete plan[k];save();renderPlan()});
  v.querySelector("#auto").onclick=autoFill;
  const c=v.querySelector("#clear"); if(c){let armed=false;c.onclick=()=>{if(!armed){armed=true;c.textContent="Atinge din nou ca să golești";setTimeout(()=>{armed=false;c.textContent="Golește planul"},3000);return}plan={};checks={};save();renderPlan();toast("Planul a fost golit")}}
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function autoFill(){
  const pools={};["md","pr","ci","gu"].forEach(c=>pools[c]=shuffle(R.filter(r=>r.c===c&&fits(r)).map(r=>r.id)));
  let n=0;days().forEach((d,i)=>{if((plan[d.k]||[]).length)return;const ids=[];["md","pr","ci","gu"].forEach(c=>{if(pools[c].length)ids.push(pools[c][i%pools[c].length])});if(ids.length){plan[d.k]=ids;n++}});
  save();renderPlan();toast(n?("Am completat "+n+(n===1?" zi":" zile")):"Toate zilele au deja rețete");
}

function openPicker(dayKey){
  const d=days().find(x=>x.k===dayKey);let sel=new Set(plan[dayKey]||[]);let f="all",q="";
  const {sc,sheet,close}=makeSheet();
  sheet.innerHTML=`<div class="pad"><div class="pick-head"><div class="toolbar"><div><span class="lbl">${d.long}</span><h2>Ce gătești ${d.i===0?"azi":d.i===1?"mâine":"în ziua asta"}?</h2></div><button class="close" aria-label="Închide">×</button></div>
    <input class="search" id="pq" type="search" placeholder="Caută" aria-label="Caută rețete">
    <div class="chips" id="pf">${[["all","Toate"],["md","Mic dejun"],["pr","Prânz"],["ci","Cină"],["gu","Gustări"]].map(([k,n])=>`<button class="chip" data-f="${k}" aria-pressed="${k==="all"}">${n}</button>`).join("")}</div>${filtersHTML()}</div>
    <div class="pick-grid" id="pg"></div>
    <div class="pick-foot"><button class="btn" id="ok"></button></div></div>`;
  const draw=()=>{const items=R.filter(r=>matches(r,q,f));
    sheet.querySelector("#pg").innerHTML=items.map(r=>`<button class="pcard" data-id="${r.id}" aria-pressed="${sel.has(r.id)}">${imgTag(r.id,"ph",r.n)}<span class="tick">✓</span><span class="body"><span class="lbl tx-${r.c}" style="font-size:.68rem">${CAT[r.c]} · ${r.t} min</span><br>${r.n}</span></button>`).join("")||`<p class="muted">Nicio rețetă nu se potrivește filtrelor.</p>`;
    sheet.querySelectorAll(".pcard").forEach(b=>b.onclick=()=>{const id=b.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);b.setAttribute("aria-pressed",sel.has(id));foot()});foot()};
  const foot=()=>{sheet.querySelector("#ok").textContent=sel.size?("Salvează "+sel.size+(sel.size===1?" rețetă":" rețete")):"Salvează"};
  sheet.querySelector("#pq").addEventListener("input",e=>{q=e.target.value;draw()});
  sheet.querySelectorAll("#pf .chip").forEach(b=>b.onclick=()=>{f=b.dataset.f;sheet.querySelectorAll("#pf .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
  bindFilters(sheet,()=>{draw();});
  sheet.querySelector(".close").onclick=close;
  sheet.querySelector("#ok").onclick=()=>{const before=(plan[dayKey]||[]).filter(id=>sel.has(id));const added=[...sel].filter(id=>!before.includes(id));plan[dayKey]=before.concat(added);if(!plan[dayKey].length)delete plan[dayKey];save();close();renderPlan();toast("Lista de cumpărături a fost actualizată")};
  draw();
}

/* ---------- Cumpărături ---------- */
function scopeDays(){const ds=days();return shopScope==="all"?ds:ds.filter(d=>d.k===shopScope)}
function shopping(){
  const agg={},recipes=[];
  scopeDays().forEach(d=>(plan[d.k]||[]).forEach(id=>{const r=byId[id];recipes.push(r);r.i.forEach(([n,q,u,g])=>{const k=n+"|"+u;if(!agg[k])agg[k]={n,u,g,q:0,k};agg[k].q+=q})}));
  return{items:Object.values(agg),recipes};
}
function updateBadge(){
  const all=days().flatMap(d=>plan[d.k]||[]);const agg=new Set();all.forEach(id=>byId[id].i.forEach(([n,,u])=>agg.add(n+"|"+u)));
  const left=[...agg].filter(k=>!checks[k]).length;const b=document.getElementById("badge");b.hidden=!left;b.textContent=left;
}
function renderCump(){
  const v=document.getElementById("v-cumparaturi"),ds=days();
  if(shopScope!=="all"&&!ds.find(d=>d.k===shopScope))shopScope="all";
  const {items,recipes}=shopping(),done=items.filter(it=>checks[it.k]).length;
  const order=["L","C","D","P","K"];
  const scopes=[["all","Toată săptămâna"],...ds.filter(d=>(plan[d.k]||[]).length).map(d=>[d.k,d.name])];
  v.innerHTML=`<div><h2>Cumpărături</h2><p class="muted">Se completează singură din rețetele din planul tău.</p></div>
  <div class="chips" id="sc">${scopes.map(([k,n])=>`<button class="chip" data-s="${k}" aria-pressed="${shopScope===k}">${n}</button>`).join("")}</div>
  ${!items.length?`<div class="empty"><p>Lista e goală. Adaugă rețete în plan și ingredientele apar aici.</p><a class="btn" href="#plan" style="text-decoration:none">Mergi la plan</a></div>`:`
  <p class="for">Pentru ${recipes.length} ${recipes.length===1?"rețetă":"rețete"} · ${done} din ${items.length} bifate</p>
  <div class="progress" aria-hidden="true"><i style="width:${done/items.length*100}%"></i></div>
  <div class="toolbar"><button class="btn small" id="copy">Copiază lista</button><button class="btn ghost small" id="reset">Debifează tot</button></div>
  ${order.map(g=>{const gi=items.filter(x=>x.g===g).sort((a,b)=>a.n.localeCompare(b.n,"ro"));if(!gi.length)return"";
    return`<div class="group"><h3>${G[g]}${g==="K"?" · verifică ce ai deja":""}</h3>${gi.map(it=>{const on=!!checks[it.k];
      return`<label class="item${on?" done":""}"><input type="checkbox" data-k="${esc(it.k)}" ${on?"checked":""}><span class="nm">${it.n}</span><span class="qt">${fmt(it.q,it.u)}</span></label>`}).join("")}</div>`}).join("")}`}`;
  v.querySelectorAll("#sc .chip").forEach(b=>b.onclick=()=>{shopScope=b.dataset.s;renderCump()});
  v.querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=()=>{if(c.checked)checks[c.dataset.k]=1;else delete checks[c.dataset.k];save();renderCump()});
  const rs=v.querySelector("#reset");if(rs)rs.onclick=()=>{items.forEach(it=>delete checks[it.k]);save();renderCump()};
  const cp=v.querySelector("#copy");if(cp)cp.onclick=()=>{
    const txt=order.map(g=>{const gi=items.filter(x=>x.g===g&&!checks[x.k]);return gi.length?G[g]+":\n"+gi.map(x=>"- "+x.n+" ("+fmt(x.q,x.u)+")").join("\n"):""}).filter(Boolean).join("\n\n");
    try{navigator.clipboard.writeText(txt).then(()=>toast("Lista a fost copiată"),()=>toast("Nu s-a putut copia"))}catch(e){toast("Nu s-a putut copia")}};
}

/* ---------- Sfaturi ---------- */
const AGE_TIPS={
 "6":["Începe cu un singur aliment nou o dată și așteaptă 2–3 zile înainte de următorul.","Piureurile la început sunt fine și destul de lichide. Câteva lingurițe sunt suficiente.","Laptele matern sau praful rămâne principala hrană. Mâncarea solidă e pentru învățat gusturi și texturi.","Fără sare, zahăr și miere. Mierea e interzisă sub 1 an.","Introdu devreme alimentele bogate în fier: carne, linte, ouă."],
 "9":["Trece treptat de la piure fin la strivit cu furculița și apoi la bucăți moi.","Bucățile cât degetul (fâșii, bastonașe) sunt ușor de prins cu mâna.","2–3 mese pe zi plus 1–2 gustări, alături de lapte.","Fără sare, zahăr și miere. Laptele de vacă se poate folosi în preparate, dar nu ca băutură principală.","Testul pentru textură: bucata trebuie să se strivească între degetul mare și arătător."],
 "12":["Poate mânca din mâncarea familiei, gătită fără sare și tăiată mărunt.","3 mese și 1–2 gustări pe zi. Laptele de vacă poate deveni băutură, cam 350–500 ml pe zi.","Lasă-l să încerce lingurița singur, chiar dacă e dezordonat.","Mierea e acum permisă, dar fără zahăr adăugat rămâne regula."],
 "18":["Mănâncă aproape tot ce mănâncă familia, cu mai puțină sare și tăiat în bucăți mici.","Cam un sfert până la o treime dintr-o porție de adult. Apetitul variază de la o zi la alta.","E vârsta la care mulți copii devin mofturoși. Pune alimentul refuzat din nou în farfurie, fără presiune.","350–500 ml lapte și lactate pe zi sunt suficiente."],
 "24":["Poate mânca singur cu lingura și furculița. Încurajează-l să participe la gătit: spălat legume, amestecat.","Porțiile cresc, dar copilul își știe singur limita. Nu-l forța să termine farfuria.","Nucile și alunele întregi rămân periculoase până la 4–5 ani. Pastele de nuci sunt în regulă dacă nu e alergic.","Gustările sănătoase la ore fixe ajută să mănânce bine la mese."]
};
function renderSfaturi(){
  const a=age();
  document.getElementById("v-sfaturi").innerHTML=`
  <h2>Sfaturi pentru ${a.n}</h2>
  <div class="tip hi"><h3>La vârsta asta</h3><ul>${AGE_TIPS[a.k].map(t=>`<li>${t}</li>`).join("")}</ul></div>
  <div class="tip warn"><h3>Atenție la înecare</h3><ul>
    <li>Strugurii, roșiile cherry și afinele mari se taie în sferturi, pe lung.</li>
    <li>Fără nuci sau alune întregi, floricele, bomboane tari sau gumă.</li>
    <li>Cârnăciorii se taie pe lung, nu în rondele.</li>
    <li>Măr crud, morcov crud: rase sau gătite până se strivesc între degete.</li>
    <li>Copilul mănâncă mereu așezat și supravegheat, niciodată în mers sau în mașină.</li></ul></div>
  <div class="tip"><h3>Sare și zahăr</h3><ul>
    <li>Cât mai puțină sare. Gătește pentru familie fără sare și sărează porțiile adulților în farfurie.</li>
    <li>Fără zahăr adăugat. Fructele coapte îndulcesc suficient.</li>
    <li>Fără sucuri, nici cele „naturale”. Apă și lapte.</li></ul></div>
  <div class="tip"><h3>Alimente noi și alergeni</h3><ul>
    <li>Un aliment poate avea nevoie de 10–15 încercări până e acceptat.</li>
    <li>Ou, pește, lactate, grâu, arahide, susan: introdu-le pe rând, în cantitate mică, și urmărește reacția.</li>
    <li>Lângă un aliment nou pune unul pe care îl mănâncă sigur.</li></ul></div>
  <div class="tip"><h3>Când întrebi medicul</h3><p>Dacă apar erupții, umflături, vărsături repetate după un aliment, sau dacă ai îndoieli despre creștere ori alergii, discută cu medicul pediatru.</p></div>`;
}

/* ---------- Sheets ---------- */
function makeSheet(){
  const sc=document.createElement("div");sc.className="scrim";
  const sheet=document.createElement("div");sheet.className="sheet";sheet.setAttribute("role","dialog");sheet.setAttribute("aria-modal","true");
  sc.appendChild(sheet);
  const onKey=e=>{if(e.key==="Escape")close()};
  const close=()=>{sc.remove();document.removeEventListener("keydown",onKey);document.body.style.overflow=""};
  sc.addEventListener("click",e=>{if(e.target===sc)close()});
  document.addEventListener("keydown",onKey);document.body.appendChild(sc);document.body.style.overflow="hidden";
  return{sc,sheet,close};
}
function openRecipe(id){
  const r=byId[id];let serv=r.s;const {sheet,close}=makeSheet();
  const unit=n=>r.s>=8?(n===1?"bucată":"bucăți"):(n===1?"porție":"porții");
  sheet.innerHTML=`<div class="hero">${imgTag(r.id,"",r.n)}<button class="close" aria-label="Închide">×</button></div>
  <div class="pad"><div class="sheet-title"><span class="lbl tx-${r.c}">${CAT[r.c]}</span><h2>${r.n}</h2>
    <div class="facts"><span>${r.t} minute</span><span>${r.a<12?r.a+" luni":(r.a/12===1.5?"1 an și 6 luni":r.a/12+(r.a===12?" an":" ani"))}+</span><span>${r.i.length} ingrediente</span></div></div>
    <div class="planbox"><b>Adaugă în plan</b><div class="daychips" id="dc"></div></div>
    <div class="toolbar"><h3>Ingrediente</h3><div class="stepper"><button data-d="-1" aria-label="Mai puține">−</button><output id="sv"></output><button data-d="1" aria-label="Mai multe">+</button></div></div>
    <ul class="ing" id="ing"></ul>
    <h3>Preparare</h3><ol class="steps">${r.p.map(s=>`<li><span>${s}</span></li>`).join("")}</ol>
    <div class="little"><b>Pentru cel mic: </b>${r.m}</div></div>`;
  const drawIng=()=>{sheet.querySelector("#sv").textContent=serv+" "+unit(serv);
    sheet.querySelector("#ing").innerHTML=r.i.map(([n,q,u])=>`<li><span>${n}</span><span class="q">${fmt(q*serv/r.s,u)}</span></li>`).join("")};
  const drawDays=()=>{const el=sheet.querySelector("#dc");el.innerHTML=days().map(d=>`<button class="chip" data-k="${d.k}" aria-pressed="${(plan[d.k]||[]).includes(id)}">${d.name}</button>`).join("");
    el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const k=b.dataset.k,l=plan[k]||[];
      if(l.includes(id)){plan[k]=l.filter(x=>x!==id);if(!plan[k].length)delete plan[k];toast("Scoasă din plan")}else{plan[k]=l.concat(id);toast("Adăugată · ingredientele sunt la Cumpărături")}
      save();drawDays();})};
  drawIng();drawDays();
  sheet.querySelectorAll(".stepper button").forEach(b=>b.onclick=()=>{const step=r.s>=8?r.s/2:1;serv=Math.max(step,Math.min(r.s*4,serv+(+b.dataset.d)*step));drawIng()});
  sheet.querySelector(".close").onclick=()=>{close();route(true)};
  sheet.parentElement.addEventListener("click",e=>{if(e.target===sheet.parentElement)route(true)});
  sheet.querySelector(".close").focus();
}

function toast(msg){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;t.setAttribute("role","status");document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}

/* ---------- Routing ---------- */
const VIEWS={retete:renderRetete,plan:renderPlan,cumparaturi:renderCump,sfaturi:renderSfaturi};
let current="";
function route(keepScroll){
  let v=(location.hash||"").slice(1);if(!VIEWS[v])v="retete";
  Object.keys(VIEWS).forEach(k=>document.getElementById("v-"+k).hidden=k!==v);
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.v===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  const y=window.scrollY;VIEWS[v]();
  if(keepScroll===true&&current===v)window.scrollTo(0,y);else if(current!==v)window.scrollTo(0,0);
  current=v;
}
window.addEventListener("hashchange",()=>route());
renderAge();save();route();
</script>
